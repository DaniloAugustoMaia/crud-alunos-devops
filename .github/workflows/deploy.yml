name: Deploy automatico

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15

    steps:
      - name: Baixar versao atual
        uses: actions/checkout@v4

      - name: Criar arquivo de ambiente
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD" || { echo "Secret DB_PASSWORD ausente"; exit 1; }
          test -n "$MYSQL_ROOT_PASSWORD" || { echo "Secret MYSQL_ROOT_PASSWORD ausente"; exit 1; }
          printf 'APP_PORT=8080\nDB_PASSWORD=%s\nMYSQL_ROOT_PASSWORD=%s\n' \
            "$DB_PASSWORD" "$MYSQL_ROOT_PASSWORD" > .env
          chmod 600 .env

      - name: Atualizar aplicacao
        run: docker compose up -d --build --remove-orphans

      - name: Verificar containers
        run: docker compose ps
